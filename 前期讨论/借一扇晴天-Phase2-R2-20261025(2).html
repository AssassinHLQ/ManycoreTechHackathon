            <div class="help-keys">

            </div>
            <p class="help-note">云舟上：<b>W / S</b> 划桨，<b>A / D</b> 转向，靠岸后按 <b>E</b> 上下船。望远镜与旅行小册都用 <b>E</b> 打开，<b>Esc</b> 退出望远镜；新手提示可随时按 <b>G</b> 收起，并可在本页顶部重播。</p>
          </div>
          <div class="help-section">
            <h3>旅途怎么进行</h3>
            <ol class="help-steps">
              <li>在阁楼里对准门边黄铜天气旋钮按 <b>E</b>，窗外会按 <b>云海 → 萤火森林 → 雪夜</b> 轮换。</li>
              <li>对准门按 <b>E</b> 推开，跨过门槛便进入窗外的世界；沿原路跨回门槛即可回阁楼。</li>
              <li>跟着左上角「此刻的小事」完成每个世界的一件小事，带回纪念放到阁楼旅行架。</li>
              <li>三件纪念归架后，仍可泡茶、翻旅行小册、再看风景；没有失败与战斗。</li>
            </ol>
          </div>

          </div>
          <div class="help-section">
            <h3>远方提示</h3>
            <div class="help-worlds">
              <article><span>❄</span><h4>雪夜小屋</h4><p>三面冰镜与炉火。让冰镜朝向该去的方向，极光会给出回礼；提灯和雪橇也值得碰一碰。主路西侧的静冰湾可以冰钓：对准冰洞按 E 垂线，浮标一沉再按 E 收线；三尾鱼会让岸边的冰灯亮起。</p></article>
              <article><span>☁</span><h4>金色云海</h4><p>木板尽头有云舟。划到三盏浮标旁按 E 点灯；云灯塔、风铃、望远镜与云桥各有回应。栈桥东侧的绳桥通向可选的风琴礁，三种来风各奏一次会有和鸣。</p></article>
              <article><span>✦</span><h4>萤火森林</h4><p>先找到玻璃罐，再收起三簇萤火，最后去林间的放飞处。水车、符文与木鼓会改变林子的光。</p></article>
            </div>
          </div>
