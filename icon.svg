      <stop offset=".25" stop-color="#95ddd6" stop-opacity=".57"/>
      <stop offset="1" stop-color="#70bcc1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="distant-star" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="matrix(17 0 0 17 0 0)">
