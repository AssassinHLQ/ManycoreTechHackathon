      <circle cx="411" cy="337" r="1.5" opacity=".66"/>
      <circle cx="463" cy="411" r="1.05" opacity=".58"/>
      <circle cx="484" cy="277" r="1.4" opacity=".69"/>
      <circle cx="24" cy="391" r=".8" opacity=".45"/>
