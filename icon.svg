    <linearGradient id="nebula-ribbon" x1="83" y1="393" x2="444" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#dd9467" stop-opacity="0"/>
      <stop offset=".28" stop-color="#ce9678" stop-opacity=".28"/>
      <stop offset=".56" stop-color="#8fadb1" stop-opacity=".45"/>
      <stop offset=".82" stop-color="#69bbc0" stop-opacity=".25"/>
      <stop offset="1" stop-color="#73c9cb" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dust-ribbon" x1="74" y1="337" x2="451" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e4a170" stop-opacity="0"/>
      <stop offset=".35" stop-color="#f0c39a" stop-opacity=".36"/>
      <stop offset=".64" stop-color="#c2d9d0" stop-opacity=".44"/>
      <stop offset="1" stop-color="#a0dbd7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hull" x1="-72" y1="-37" x2="87" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#536675"/>
      <stop offset=".28" stop-color="#a9b5b1"/>
      <stop offset=".57" stop-color="#e2dfcf"/>
      <stop offset=".79" stop-color="#879ca0"/>
      <stop offset="1" stop-color="#415561"/>
