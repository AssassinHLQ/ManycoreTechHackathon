      <path d="M-92-13L-70-15M-86-9L-66-11M-92 12L-70 15M-86 9L-66 11" stroke="#93a9aa" stroke-opacity=".4" stroke-width=".75"/>
      <path d="M-75-3L-53-12L-34-16L-8-22L25-21L55-15L99-2L70 8L41 13L18 20L-13 23L-41 15L-60 10L-77 5Z" fill="url(#hull)" stroke="#c1c6bb" stroke-opacity=".65" stroke-width="1.1" stroke-linejoin="round"/>
      <path d="M-72 1L-53-5L-34-9L-20-5L-7 1L-22 8L-42 11L-61 7Z" fill="url(#armor)"/>
      <path d="M-35-14L-5-20L24-18L48-13L36-7L11-5L-13-8Z" fill="#d7d5c8" opacity=".85"/>
      <path d="M-38 14L-11 22L17 18L37 12L18 7L-9 9Z" fill="#435965" opacity=".9"/>
      <path d="M8-4L38-9L66-7L82-2L65 4L37 6L9 2Z" fill="url(#glass)" stroke="#91a9a8" stroke-opacity=".77" stroke-width=".9"/>
      <path d="M16-3L40-7L58-6" fill="none" stroke="#c7d5c8" stroke-opacity=".62" stroke-width=".8"/>
      <path d="M91-2L107-1L90 3Z" fill="#ede1c7"/>
      <path d="M-76-3L-88-3M-76 3L-88 3" stroke="#d2b68f" stroke-width="2.1" stroke-linecap="round"/>
      <path d="M-105-12L-97-12M-105 11L-97 11" stroke="#8bd2ce" stroke-width="2.2" stroke-linecap="round"/>
      <ellipse cx="-108" cy="-11" rx="22" ry="9" fill="url(#drive)"/>
      <ellipse cx="-108" cy="11" rx="22" ry="9" fill="url(#drive)"/>
      <path d="M-20-24L-14-31M-20 24L-14 31" stroke="#d7b88f" stroke-width="1.3" stroke-linecap="round"/>
    </g>

    <circle cx="253" cy="242" r="2.3" fill="#fff1d5" opacity=".64"/>
    <circle cx="253" cy="242" r="8" fill="none" stroke="#efd1a8" stroke-opacity=".18" stroke-width=".75"/>
  </g>
</svg>
