<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Borrowed Sky</title>
  <desc>An exploration craft crossing a layered nebula under a dense field of stars.</desc>
  <defs>
    <linearGradient id="space" x1="48" y1="25" x2="467" y2="493" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101725"/>
      <stop offset=".48" stop-color="#080e18"/>
      <stop offset="1" stop-color="#080a12"/>
    </linearGradient>
    <radialGradient id="deep-cloud" cx="293" cy="231" r="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#376d7b" stop-opacity=".53"/>
      <stop offset=".36" stop-color="#294859" stop-opacity=".37"/>
      <stop offset=".72" stop-color="#182636" stop-opacity=".18"/>
      <stop offset="1" stop-color="#111923" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm-cloud" cx="186" cy="303" r="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c07c59" stop-opacity=".39"/>
      <stop offset=".38" stop-color="#80566a" stop-opacity=".27"/>
      <stop offset="1" stop-color="#583c5a" stop-opacity="0"/>
