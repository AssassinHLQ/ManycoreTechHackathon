      <stop offset=".54" stop-color="#182635"/>
      <stop offset="1" stop-color="#293a46"/>
    </linearGradient>
    <linearGradient id="glass" x1="12" y1="-12" x2="45" y2="8" gradientUnits="userSpaceOnUse">
      <stop stop-color="#233a49"/>
      <stop offset=".5" stop-color="#142a3a"/>
      <stop offset="1" stop-color="#607985"/>
