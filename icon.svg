      <circle cx="353" cy="61" r=".85" opacity=".44"/>
      <circle cx="383" cy="142" r="1.6" opacity=".72"/>
      <circle cx="412" cy="78" r="1.1" opacity=".59"/>
      <circle cx="462" cy="112" r="1.7" opacity=".77"/>
      <circle cx="481" cy="184" r=".85" opacity=".51"/>
      <circle cx="53" cy="246" r="1" opacity=".46"/>
      <circle cx="88" cy="302" r="1.4" opacity=".6"/>
      <circle cx="121" cy="366" r=".9" opacity=".55"/>
      <circle cx="166" cy="278" r="1.2" opacity=".63"/>
