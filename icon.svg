      <path d="M-105-18L-67-23L-42-21L-35-74L-23-80L-9-28L24-30L40-19L75-13L111-2L88 8L57 14L34 18L-1 30L-23 80L-35 74L-42 21L-67 23L-105 17L-89 0Z" fill="#07111c" stroke="#1b2b39" stroke-width="5" stroke-linejoin="round"/>
      <path d="M-42-22L-36-69L-27-72L-16-29L-25-25Z" fill="url(#solar)" stroke="#8ca0a1" stroke-opacity=".62" stroke-width="1.1"/>
