    <path d="M-40 341C42 293 84 286 131 307C174 326 193 325 229 294C270 258 286 203 335 171C384 139 446 146 555 89L555 147C472 199 426 195 387 219C345 245 330 292 295 323C247 365 207 370 162 346C112 319 76 326-40 390Z" fill="#192d3c" opacity=".54"/>
    <path d="M-37 337C40 293 87 286 131 307C174 326 193 325 229 294C270 258 286 203 335 171C384 139 446 146 555 89" fill="none" stroke="url(#nebula-ribbon)" stroke-width="42" opacity=".62"/>
