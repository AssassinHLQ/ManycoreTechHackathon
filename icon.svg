    <path d="M48 253C104 235 136 239 165 257M319 179C346 156 369 151 394 151M393 225C435 210 471 204 519 178" fill="none" stroke="#c1c8c3" stroke-opacity=".13" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M82 275C106 264 123 265 142 273M235 273C254 251 264 231 272 212M365 191C391 177 413 174 436 177" fill="none" stroke="#e2bd98" stroke-opacity=".14" stroke-width=".75" stroke-linecap="round"/>

    <g fill="#b6b9ac" opacity=".19">
      <circle cx="68" cy="330" r="1.2"/>
      <circle cx="79" cy="323" r=".8"/>
      <circle cx="95" cy="336" r="1.5"/>
      <circle cx="103" cy="311" r=".9"/>
      <circle cx="112" cy="344" r="1.1"/>
      <circle cx="132" cy="316" r=".75"/>
      <circle cx="146" cy="351" r="1.25"/>
      <circle cx="186" cy="338" r=".8"/>
      <circle cx="205" cy="306" r="1.1"/>
      <circle cx="298" cy="256" r=".9"/>
      <circle cx="312" cy="247" r="1.4"/>
      <circle cx="333" cy="272" r=".8"/>
      <circle cx="367" cy="210" r="1.2"/>
      <circle cx="391" cy="196" r=".8"/>
